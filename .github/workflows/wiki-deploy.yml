name: Deploy Wiki

on:
  push:
    branches:
      - main
    paths:
      - "wiki/**"
      - "agent/src/factors/**"
      - ".github/workflows/wiki-deploy.yml"

concurrency:
  group: wiki-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Cloudflare token/account are upstream-only secrets. A fork that
      # force-pushes a history containing wiki/** would otherwise trigger this
      # workflow and fail at the deploy step with "Not logged in". Probe the
      # secrets and skip the build/deploy when they are absent, so a fork run
      # reports success-with-a-notice instead of a red X.
      - name: Check Cloudflare credentials
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set on this repository; skipping the wiki deploy."
          fi

      # The Alpha Library pages are generated, not committed: export the
      # registry's manifest and render one page per alpha before uploading.
      - name: Set up Python
        if: steps.cf.outputs.configured == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Build the Alpha Library
        if: steps.cf.outputs.configured == 'true'
        run: |
          python -m pip install --quiet -e .
          vibe-trading alpha export-manifest --out wiki/alpha-library/manifest.json --force
          python wiki/scripts/build_alpha_library.py --clean
          test -f wiki/alpha-library/content/index.json

      - name: Deploy wiki
        if: steps.cf.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Deploy from inside wiki/ (config mode) so wrangler reads
          # wiki/wrangler.toml and compiles wiki/functions/ as Pages Functions.
          # Deploying the dir positionally (`pages deploy wiki`) uploads the
          # functions as static files and never compiles them.
          workingDirectory: wiki
          wranglerVersion: "4.98.0"
          command: pages deploy --project-name=vibetrading-wiki --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
